name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # create the GitHub release
  id-token: write      # sign build provenance
  attestations: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --manifest-path sniffer-core/Cargo.toml --locked

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04   # older glibc, so the binary runs on more distros
            target: x86_64-unknown-linux-gnu
            asset: agris-sniffer-x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: agris-sniffer-x86_64-pc-windows-msvc.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # libpcap is linked statically: distros name the shared library differently
      # (Debian/Ubuntu libpcap.so.0.8, Arch/Fedora libpcap.so.1), so a dynamically
      # linked binary only runs on one family. Built without optional extras
      # (D-Bus, RDMA, Bluetooth, USB, netlink) so it has no other dependencies.
      - name: Build static libpcap
        if: runner.os == 'Linux'
        env:
          LIBPCAP: libpcap-1.10.5
        run: |
          sudo apt-get update && sudo apt-get install -y flex bison
          curl -sSfLO "https://www.tcpdump.org/release/$LIBPCAP.tar.xz"
          sha256sum "$LIBPCAP.tar.xz"
          tar xf "$LIBPCAP.tar.xz"
          cd "$LIBPCAP"
          ./configure --prefix="$RUNNER_TEMP/libpcap" --disable-shared --disable-dbus --disable-rdma \
            --disable-bluetooth --disable-usb --disable-netmap --without-libnl --without-dpdk
          make -j"$(nproc)" && make install
          echo "LIBPCAP_LIBDIR=$RUNNER_TEMP/libpcap/lib" >> "$GITHUB_ENV"
          echo "LIBPCAP_VER=1.10.5" >> "$GITHUB_ENV"

      - name: Install Npcap SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://npcap.com/dist/npcap-sdk-1.15.zip -OutFile npcap-sdk.zip
          Expand-Archive npcap-sdk.zip -DestinationPath npcap-sdk
          "LIB=$PWD\npcap-sdk\Lib\x64;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build
        run: cargo build --release --locked --manifest-path agris-sniffer/Cargo.toml --target ${{ matrix.target }}

      - name: Stage
        shell: bash
        run: |
          mkdir dist
          src=agris-sniffer/target/${{ matrix.target }}/release/agris-sniffer
          [[ "${{ runner.os }}" == "Windows" ]] && src="$src.exe"
          cp "$src" "dist/${{ matrix.asset }}"

      - name: Check the Linux binary is portable
        if: runner.os == 'Linux'
        run: |
          ldd "dist/${{ matrix.asset }}"
          if ldd "dist/${{ matrix.asset }}" | grep -q libpcap; then echo "libpcap is dynamically linked"; exit 1; fi
          "dist/${{ matrix.asset }}" --version

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum agris-sniffer-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
