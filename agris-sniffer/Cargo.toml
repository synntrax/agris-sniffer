[package]
name = "agris-sniffer"
version = "0.2.1"
edition = "2024"
description = "Packet-capture helper for the Agris loot tracker"
license = "MIT"
repository = "https://github.com/synntrax/agris-sniffer"

[dependencies]
serde_json = "1"
sniffer-core = { path = "../sniffer-core" }
pcap = "2"
etherparse = "0.19"

[features]
# Dev-only research capture (`--probe <file>`: raw payloads to a file). Release builds leave it off.
probe = []
